services:
  postgres:
    image: postgres:16
    container_name: team_chat_postgres
    restart: always
    environment:
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_pass
      POSTGRES_DB: team_chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: team_chat_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
